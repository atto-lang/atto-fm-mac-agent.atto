name: Static Python and corpus gate

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile without imports or MLX runtime
        run: python3 scripts/static_gate.py
      - name: Validate benchmark reports with pure Python fixtures
        run: python3 -m unittest discover -s tests -p test_benchmarks.py -v
